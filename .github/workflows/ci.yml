name: CI

# What Cloudflare's own build does not run: unit tests (including launch criterion 7), type and
# Astro checks, the pipeline tests and the data validator. Cloudflare Pages builds and deploys
# separately (Git integration); this workflow only reports.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Astro check
        run: npm run check
      - name: Build (as Cloudflare does)
        run: npm run build

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Pipeline tests
        run: python -m unittest discover -s pipeline/tests -p "test_*.py"
      - name: Validate every week file
        run: python pipeline/validate.py --all
