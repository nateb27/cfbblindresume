# Cloudflare Pages project: static site (Astro build in dist/) + Pages Functions (functions/) + D1.
# Setup and deploy notes: README.md (Deploy) and functions/README.md.
# Cloudflare Pages Git integration reads this file as the source of truth for bindings.
name = "cfbblindresume"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
# node:zlib (native, synchronous) for the share-image PNG: functions/_lib/png.ts.
compatibility_flags = ["nodejs_compat"]

# PUBLIC_ADS is read at build time by Astro (import.meta.env); listed here so Pages previews and
# `wrangler pages dev` match production. Ads default off.
[vars]
PUBLIC_ADS = "off"

# IP_SALT is a secret, not a var: `npx wrangler pages secret put IP_SALT --project-name cfbblindresume`
# (production), the dashboard for previews (Settings > Variables and Secrets > Preview), and a
# `.dev.vars` file (gitignored) with IP_SALT=... for local dev.

[[d1_databases]]
binding = "DB"
database_name = "cfbblindresume"
database_id = "dc3a441c-74d4-45d2-aa64-0c475bf7b8e3"
migrations_dir = "migrations"

# Preview deployments (every branch other than main, e.g. staging) get their own database so test
# votes never reach the production fan consensus. Same schema: apply migrations to both.
[env.preview]
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[env.preview.vars]
PUBLIC_ADS = "off"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "cfbblindresume-preview"
database_id = "66ece0b7-4fc3-4eda-9d19-b9a7a4a31b4e"
migrations_dir = "migrations"
